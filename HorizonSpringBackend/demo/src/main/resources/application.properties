spring.application.name=demo

# Backend HTTP port (Angular dev server runs on 54200 - see CORS in SecurityConfig)
server.port=58080

# TODO: fill in your local PostgreSQL credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/horizon
spring.datasource.username=postgres
spring.datasource.password=a1l2i3
spring.datasource.driver-class-name=org.postgresql.Driver

# Prototyping phase only. Switch to validate + Flyway migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gmail SMTP for password-reset emails. Set MAIL_USERNAME/MAIL_PASSWORD as real
# environment variables (don't hardcode real credentials here) - MAIL_PASSWORD
# is a Gmail "App Password" (Google Account > Security > 2-Step Verification
# must be ON > App passwords > generate one for "Mail"), NOT your normal Gmail
# login password. Left blank, the app still starts fine; forgot-password
# requests will just fail at send-time with a clear error instead of crashing.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Horizon AI Concierge (Google Gemini). Set GEMINI_API_KEY as a real environment
# variable (Google AI Studio free key) - never hardcode it here. Left blank, the
# chat endpoint still starts fine; requests will fail gracefully at call-time.
google.ai.api-key=${GEMINI_API_KEY:}
google.ai.model-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
google.ai.timeout-ms=8000
google.ai.max-output-tokens=512
